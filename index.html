<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15131c;
    --panel: #1f1c2a;
    --ink: #f3f1ea;
    --ink-dim: #a9a4ba;
    --accent: #ff6b35;
    --accent-ink: #15131c;
    --line: #3a3550;
    font-family: 'Inter', Arial, sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f3f1ea;
    --panel: #ffffff;
    --ink: #15131c;
    --ink-dim: #605c72;
    --line: #ddd7e8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { padding: 0 18px 60px; }

  header {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 0 28px;
    text-align: left;
  }
  .brand {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .brand span { color: var(--accent); }
  header p {
    color: var(--ink-dim);
    font-size: 1.05rem;
    max-width: 480px;
    margin: 0;
  }

  nav.tabs {
    max-width: 880px;
    margin: 0 auto 32px;
    display: flex;
    gap: 10px;
    border-bottom: 2px solid var(--line);
  }
  nav.tabs button {
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.95rem;
    background: none;
    border: none;
    color: var(--ink-dim);
    padding: 10px 4px 14px;
    cursor: pointer;
    position: relative;
    letter-spacing: 0.02em;
  }
  nav.tabs button.active { color: var(--ink); }
  nav.tabs button.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 3px;
    background: var(--accent);
  }

  main { max-width: 880px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 20px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px;
    width: 14px; height: 14px;
    background: var(--bg);
    border-right: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
  }
  .card .emoji { font-size: 2.4rem; display: block; margin-bottom: 10px; }
  .card h3 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.1rem;
    margin: 0 0 6px;
  }
  .card p {
    color: var(--ink-dim);
    font-size: 0.92rem;
    line-height: 1.45;
    margin: 0 0 16px;
    min-height: 2.6em;
  }
  .card a {
    display: inline-block;
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.85rem;
    text-decoration: none;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .card a:active { transform: translateY(1px); }

  .empty {
    color: var(--ink-dim);
    border: 2px dashed var(--line);
    padding: 28px;
    text-align: center;
    font-size: 0.95rem;
    grid-column: 1 / -1;
  }

  footer {
    max-width: 880px;
    margin: 48px auto 0;
    color: var(--ink-dim);
    font-size: 0.8rem;
    border-top: 2px solid var(--line);
    padding-top: 16px;
  }
</style>
</head>
<body>

<header>
  <h1 class="brand">ARKADA<span>.</span></h1>
  <p>Gry i launchery robione przez nas, do grania w przeglądarce albo do pobrania na swój sprzęt.</p>
</header>

<nav class="tabs">
  <button class="active" data-view="gry">Gry</button>
  <button data-view="launchery">Launchery</button>
</nav>

<main>
  <section id="view-gry" class="view active">
    <div class="grid" id="grid-gry"></div>
  </section>
  <section id="view-launchery" class="view">
    <div class="grid" id="grid-launchery"></div>
  </section>
</main>

<footer>Dopisz swoją grę lub launcher w kodzie strony — instrukcja na początku pliku.</footer>

<script>
/* ============================================================
   JAK DODAĆ NOWĄ GRĘ ALBO LAUNCHER
   ------------------------------------------------------------
   Poniżej są dwie listy: GAMES i LAUNCHERS.
   Żeby coś dodać, dopisz nowy wiersz { ... } na końcu listy,
   PRZED zamykającym ].  Skopiuj wzór poniżej i zmień wartości.

   title - nazwa gry/launchera
   desc  - krótki opis (1-2 zdania)
   emoji - jedna ikonka emoji
   url   - link do gry (np. "game.html") albo do pliku do pobrania
   label - tekst na przycisku, np. "Zagraj" albo "Pobierz"
   ============================================================ */

const GAMES = [
  {
    title: "kebeb100klikniec",
    desc: "Klikaj kebaba, zbierz 100 kliknięć i odblokuj minigrę z łapaniem kebabów.",
    emoji: "🥙",
    url: "game.html",
    label: "Zagraj"
  },
  // { title: "Nowa gra", desc: "Opis gry.", emoji: "🎮", url: "nowa-gra.html", label: "Zagraj" },
];

const LAUNCHERS = [
  {
    title: "CS2 Launcher Pro V3",
    desc: "Launcher do Counter-Strike 2. Pobierz plik .exe i odpal u siebie.",
    emoji: "🎯",
    url: "    url: "https://github.com/TWOJ_LOGIN/arkada/releases/download/v1.0/CS2_Launcher_Pro_V3.exe",",
    label: "Pobierz"
  },
  // { title: "Launcher gry X", desc: "Pobierz i odpal u siebie.", emoji: "🚀", url: "launcher.exe", label: "Pobierz" },
];

function renderGrid(containerId, items) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '<div class="empty">Jeszcze nic tu nie ma. Dopisz pierwszy wpis w kodzie strony.</div>';
    return;
  }
  el.innerHTML = items.map(it => `
    <div class="card">
      <span class="emoji">${it.emoji}</span>
      <h3>${it.title}</h3>
      <p>${it.desc}</p>
      <a href="${it.url}"${/\.(exe|zip|msi|rar|7z)(\?|$)/i.test(it.url) ? ' download' : ''}>${it.label}</a>
    </div>
  `).join('');
}

renderGrid('grid-gry', GAMES);
renderGrid('grid-launchery', LAUNCHERS);

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});
</script>

</body>
</html>
